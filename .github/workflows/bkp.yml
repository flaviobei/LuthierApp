name: Backup Automático do Banco de Dados

on:
  schedule:
    # Roda todos os dias às 03:00 da manhã (UTC) - 00:00 no Brasil
    - cron: '0 3 * * *'
  workflow_dispatch: 

jobs:
  backup-to-drive:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Instalar ferramentas do PostgreSQL 17
        run: |
          # Adiciona o repositório oficial do PostgreSQL para ter acesso à versão 17
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update
          # Instala especificamente a versão 17
          sudo apt-get install -y postgresql-client-17

      - name: 🗄️ Fazer o Dump (Exportação) do Banco de Dados
        run: |
          # Usamos aspas para garantir que o bash leia a URL como um texto único
          pg_dump "${{ secrets.SUPABASE_DB_URL }}" -c -O -f backup_luthierapp.sql

      - name: ☁️ Enviar para o Google Drive
        # Esta é a versão exata e atualizada da biblioteca
        uses: adityak74/google-drive-upload-git-action@main
        with:
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          filename: backup_luthierapp.sql
          folderId: ${{ secrets.GDRIVE_FOLDER_ID }}
          # Nome do arquivo no Drive com a data da execução
          name: "LuthierApp_Backup_${{ github.run_number }}.sql"
          overwrite: "false"
