name: Backup Automático do Banco de Dados

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: 

jobs:
  backup-to-drive:
    runs-on: ubuntu-latest

    steps:
      - name: 🗄️ Fazer o Dump usando Docker (PostgreSQL 17 Puro)
        run: |
          # O Docker baixa o Postgres 17 oficial e faz o dump diretamente para o arquivo
          docker run --rm postgres:17 pg_dump "${{ secrets.SUPABASE_DB_URL }}" -c -O > backup_luthierapp.sql

      - name: ☁️ Enviar para o Google Drive
        uses: adityak74/google-drive-upload-git-action@main
        with:
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          filename: backup_luthierapp.sql
          folderId: ${{ secrets.GDRIVE_FOLDER_ID }}
          name: "LuthierApp_Backup_${{ github.run_number }}.sql"
          overwrite: "false"
